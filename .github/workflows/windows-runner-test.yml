
name: Test My Windows Server

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify my laptop is executing the job
        shell: powershell
        run: |
          Write-Host "My laptop is running this GitHub Actions job!"
          Write-Host "Computer name: $env:COMPUTERNAME"
          Get-Date
          git --version
